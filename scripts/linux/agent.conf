# ZeusLock agent — managed configuration.
# Location: /etc/zeuslock/agent.conf   (the agent's managed/highest-priority scope)
# Format:   KEY=VALUE, one per line. '#' and ';' start comments. Quotes optional.
#
# Fill in the two required values, copy to /etc/zeuslock/agent.conf (root:root, 0644).

ServerUrl=YOUR_SERVER_URL
LicenseKey=YOUR_LICENSE_KEY

# Optional toggles (defaults shown) — uncomment to override centrally:
AgentEnabled=true
BlockingEnabled=true
NetworkMonitoring=true
FileMonitoring=true
# ClipboardMonitoring=true
# LogLevel=info
