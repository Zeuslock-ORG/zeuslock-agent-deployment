# ZeusLock agent: managed configuration (fleets).
# Location: /etc/zeuslock/agent.conf. The agent reads it first; a license key here makes
#           the PC "managed" (users cannot quit the agent).
# Format:   KEY=VALUE, one per line. '#' and ';' start comments. Quotes optional.
#
# Fill in the two required values. It holds the license key, so install it as
# root:zeuslock 0640 in a 0750 folder (the agent reads it as the desktop user, who must
# be in group zeuslock; see docs/03-linux.md):
#   sudo groupadd --system zeuslock            # if the group does not exist yet
#   sudo install -d -m 0750 -o root -g zeuslock /etc/zeuslock
#   sudo install -m 0640 -o root -g zeuslock agent.conf /etc/zeuslock/agent.conf
# The install script and the Ansible playbook do all of this for you.

ServerUrl=YOUR_SERVER_URL
LicenseKey=YOUR_LICENSE_KEY

# Optional settings (see docs/configuration-reference.md). Remove the '#' to use one.
# UiLanguage=fr
# UpstreamProxy=auto
# ManagedUncleanStop=protect
